  /v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список заказов
      description: Требует scope orders:read. Пагинация.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создать заказ
      description: |
        Требует scope orders:write. Каждый item.product_id должен существовать,
        быть status active и иметь stock > 0, иначе 422. unit_price и total_amount
        считаются сервером. Поддерживает Idempotency-Key: повтор с тем же ключом
        и телом за 24ч возвращает тот же заказ (201); тот же ключ, другое тело — 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Конфликт (в т.ч. Idempotency-Key с другим телом)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/idempotency-key-reuse
                title: Idempotency key reuse
                status: 409
                detail: Same Idempotency-Key used with a different request body
                instance: /v1/orders
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/orderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получить заказ по id
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/orderId'
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Изменить статус заказа
      description: |
        Матрица переходов: pending→confirmed→shipped→delivered;
        pending и confirmed→cancelled. delivered и cancelled — финальные,
        дальнейшие переходы невозможны. Недопустимый переход — 422.
        Требует scope orders:write.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }