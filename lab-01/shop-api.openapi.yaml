  /v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров с фильтрами
      description: |
        Пагинация + фильтры: q (поиск по name/sku, ≥2 символов), category_id, status,
        min_price/max_price (рубли), sort (name|price|created_at, default created_at),
        direction (asc|desc, default desc).
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
        - name: category_id
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: min_price
          in: query
          schema: { type: integer, format: int64 }
        - name: max_price
          in: query
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          schema: { type: string, enum: [name, price, created_at], default: created_at }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [products]
      operationId: createProduct
      summary: Создать товар
      description: Требует scope products:write. Опционально поддерживает Idempotency-Key.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/products/{productId}:
